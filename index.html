<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Tălmaci — Atelier de versuri</title>
<meta name="description" content="Traduceri și compoziții de versuri în română — text, rime, sinonime și referințe biblice, într-un singur loc." />
<meta name="theme-color" content="#2C3E66" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tălmaci" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="icon" href="./icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking first paint (media="print" until it arrives):
     a render-blocking cross-origin stylesheet on a stalled connection holds
     the whole page blank white, and the fallback fonts are fine meanwhile. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

<!-- The app's own files carry the release in their URLs (?v=), the same
     number as CACHE_NAME in service-worker.js — bump both together. A page
     then always gets one release's files: the worker serves a stored file
     only when its URL matches exactly, so a new page never picks up an
     old stylesheet that happened to load faster, and an old page from the
     cache never mixes in new code. -->
<link rel="stylesheet" href="./styles.css?v=117" />
</head>
<body>

<!-- Static spinner until the scripts below have loaded and boot() takes
     over, so a slow start never looks like a dead blank page. Same markup
     as _renderBootLoading() in app.js. -->
<div id="app"><div class="loading-state"><div class="spinner"></div></div></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-functions-compat.js"></script>
<script src="./js/firebase-config.js?v=117"></script>
<script src="./js/auth.js?v=117"></script>
<script src="./js/db.js?v=117"></script>
<script src="./js/utils.js?v=117"></script>
<script src="./js/sections.js?v=117"></script>
<script src="./js/translate.js?v=117"></script>
<script src="./js/ro-phonetics.js?v=117"></script>
<script src="./js/rhyme.js?v=117"></script>
<script src="./js/activity.js?v=117"></script>
<script src="./js/songs.js?v=117"></script>
<script src="./js/rime-tab.js?v=117"></script>
<script src="./js/sinonime-tab.js?v=117"></script>
<script src="./js/engleza-tab.js?v=117"></script>
<script src="./js/biblic-tab.js?v=117"></script>
<script src="./js/bible-tab.js?v=117"></script>
<script src="./js/song-detail.js?v=117"></script>
<script src="./js/app.js?v=117"></script>

<script>
// Registered after load so it never competes with the app's own first
// paint. Deliberately no reload when the worker takes over.
//
// Reloading on 'controllerchange' is the standard move, but it belongs to
// a cache-first worker, where the page you are looking at may be running
// assets frozen at some earlier install and only a reload picks up the new
// ones. This worker is network-first (see service-worker.js), so the page
// already holds the newest files in every case: on a first visit there was
// no worker and they came straight off the network, and after a deploy the
// page was loaded through the previous worker, which also goes to the
// network. Offline, a reload would only re-read the same cache.
//
// So the reload bought nothing and cost a visible second load a few
// seconds after opening — once on a first visit, and once more after every
// deploy, since a changed service-worker.js activates and claims the page.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
